version: "3.9"
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devrecruiter-mssql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./db/sql:/docker-entrypoint-initdb   # montamos los .sql para el init-helper
  initdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devrecruiter-mssql-init
    depends_on:
      - mssql
    entrypoint: ["/bin/bash","-c"]
    command: >
      "
      /opt/mssql-tools18/bin/sqlcmd -S mssql,1433 -U sa -P 'YourStrong!Passw0rd' -C -l 60
      -Q \"SELECT 1\" ;
      for f in /docker-entrypoint-initdb/*.sql; do
        echo Running $$f;
        /opt/mssql-tools18/bin/sqlcmd -S mssql,1433 -U sa -P 'YourStrong!Passw0rd' -C -l 60 -d master -i $$f || exit 1;
      done
      "
    volumes:
      - ./db/sql:/docker-entrypoint-initdb
volumes:
  mssql_data:
