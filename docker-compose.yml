services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devrecruiter-mssql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./server/src/db/sql:/docker-entrypoint-initdb

  initdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devrecruiter-mssql-init
    depends_on:
      - mssql
    entrypoint: [ "/bin/bash", "-c" ]
    command: >
      " /opt/mssql-tools18/bin/sqlcmd -S mssql,1433 -U sa -P 'YourStrong!Passw0rd' -C -l 60 -Q \"SELECT 1\" ; for f in /docker-entrypoint-initdb/*.sql; do
        echo Running $$f;
        /opt/mssql-tools18/bin/sqlcmd -S mssql,1433 -U sa -P 'YourStrong!Passw0rd' -C -l 60 -d master -i $$f || exit 1;
      done "
    volumes:
      - ./server/src/db/sql:/docker-entrypoint-initdb

  backend:
    build: ./server
    container_name: devrecruiter-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=mssql
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASS=YourStrong!Passw0rd
      - DB_NAME=DevRecruiter
      - FRONTEND_URL=http://localhost
      # JWT Secrets (Should be changed in production)
      - ACCESS_TOKEN_SECRET=super_secret_accesstoken_32chars_min
      - REFRESH_TOKEN_SECRET=super_secret_refreshtoken_32chars_min
    depends_on:
      - mssql

  frontend:
    build: .
    container_name: devrecruiter-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mssql_data:
